# Runs this service as a container on the growercare-local-platform network (ADR-017).
#   1. growercare-local-platform: docker compose up -d --wait   (and identity-access-service running)
#   2. here: cp .env.example .env && mvn -B package jib:dockerBuild -DskipTests && docker compose up -d
services:
  grower-service:
    image: ghcr.io/manjunathyadavs1998/grower-service:${IMAGE_TAG:-1.0.0-SNAPSHOT}
    container_name: gc-grower
    env_file: .env                     # the ONLY configuration input (SPEC-PLAT-06 R77)
    ports:
      - "8084:8084"                    # 8083 is Kafka Connect in growercare-local-platform
    restart: unless-stopped

networks:
  default:
    name: growercare
    external: true
